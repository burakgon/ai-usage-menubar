<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="270" viewBox="0 0 1000 270" role="img" aria-labelledby="title description">
  <title id="title">Background resource comparison</title>
  <description id="description">Matching bars compare CPU activity, interface memory, and battery drain. Other always-on usage apps remain active. AI Usage releases its panel and only wakes briefly for scheduled refreshes.</description>

  <rect width="1000" height="270" rx="16" fill="#0D1117"/>
  <line x1="500" y1="24" x2="500" y2="224" stroke="#30363D"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="43" fill="#F0F3F6" font-size="20" font-weight="700">Other usage apps</text>
    <text x="460" y="43" fill="#FF6B5E" font-size="15" font-weight="700" text-anchor="end">Always active</text>

    <text x="540" y="43" fill="#F0F3F6" font-size="20" font-weight="700">AI Usage</text>
    <text x="960" y="43" fill="#30D158" font-size="15" font-weight="700" text-anchor="end">Lightweight</text>

    <g font-size="13" font-weight="650">
      <text x="40" y="82" fill="#AAB3BE">CPU</text>
      <text x="460" y="82" fill="#FF8A80" text-anchor="end">Active</text>
      <rect x="40" y="94" width="420" height="10" rx="5" fill="#252B33"/>
      <rect x="40" y="94" width="350" height="10" rx="5" fill="#FF6B5E"/>

      <text x="40" y="139" fill="#AAB3BE">Interface memory</text>
      <text x="460" y="139" fill="#FF8A80" text-anchor="end">Loaded</text>
      <rect x="40" y="151" width="420" height="10" rx="5" fill="#252B33"/>
      <rect x="40" y="151" width="310" height="10" rx="5" fill="#FF6B5E"/>

      <text x="40" y="196" fill="#AAB3BE">Battery drain</text>
      <text x="460" y="196" fill="#FF8A80" text-anchor="end">Constant</text>
      <rect x="40" y="208" width="420" height="10" rx="5" fill="#252B33"/>
      <rect x="40" y="208" width="260" height="10" rx="5" fill="#FF6B5E"/>

      <text x="540" y="82" fill="#AAB3BE">CPU</text>
      <text x="960" y="82" fill="#69E693" text-anchor="end">0.0%*</text>
      <rect x="540" y="94" width="420" height="10" rx="5" fill="#252B33"/>

      <text x="540" y="139" fill="#AAB3BE">Interface memory</text>
      <text x="960" y="139" fill="#69E693" text-anchor="end">Released</text>
      <rect x="540" y="151" width="420" height="10" rx="5" fill="#252B33"/>

      <text x="540" y="196" fill="#AAB3BE">Battery drain</text>
      <text x="960" y="196" fill="#69E693" text-anchor="end">Refresh only</text>
      <rect x="540" y="208" width="420" height="10" rx="5" fill="#252B33"/>
      <rect x="540" y="208" width="34" height="10" rx="5" fill="#30D158"/>
    </g>

    <text x="500" y="251" fill="#7D8793" font-size="12" font-weight="600" text-anchor="middle">* Panel closed · 0.0% CPU between scheduled refreshes · 10/10 one-second samples on v0.1.6</text>
  </g>
</svg>
