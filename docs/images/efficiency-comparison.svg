<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title description">
  <title id="title">AI Usage idle efficiency comparison</title>
  <description id="description">Other usage trackers may keep their dashboard running. AI Usage releases its panel when closed, measured at zero percent CPU across ten release-test samples.</description>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090C10"/>
    </linearGradient>
    <linearGradient id="ai-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172434"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1000" height="420" rx="28" fill="url(#canvas)"/>
  <text x="500" y="36" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2.4" text-anchor="middle">WHEN THE PANEL IS CLOSED</text>

  <g filter="url(#shadow)">
    <rect x="34" y="58" width="450" height="312" rx="24" fill="#151A21" stroke="#30363D"/>
    <rect x="516" y="58" width="450" height="312" rx="24" fill="url(#ai-card)" stroke="#0A84FF" stroke-opacity=".72"/>
  </g>

  <circle cx="72" cy="94" r="8" fill="#FF9F0A"/>
  <text x="92" y="101" fill="#C9D1D9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing=".8">OTHER TRACKERS</text>
  <circle cx="554" cy="94" r="8" fill="#30D158"/>
  <text x="574" y="101" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing=".8">AI USAGE</text>

  <text x="259" y="145" fill="#FFB340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="800" text-anchor="middle">STILL RUNNING</text>
  <text x="741" y="145" fill="#30D158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="800" text-anchor="middle">SLEEPS</text>

  <g transform="translate(113 165)">
    <rect width="292" height="100" rx="15" fill="#202630" stroke="#484F58"/>
    <circle cx="20" cy="19" r="4" fill="#FF605C"/>
    <circle cx="34" cy="19" r="4" fill="#FFBD44"/>
    <circle cx="48" cy="19" r="4" fill="#00CA4E"/>
    <rect x="20" y="42" width="92" height="10" rx="5" fill="#484F58"/>
    <rect x="20" y="64" width="202" height="9" rx="4.5" fill="#30363D"/>
    <rect x="20" y="64" width="152" height="9" rx="4.5" fill="#FF9F0A"/>
    <circle cx="257" cy="55" r="18" fill="#FF9F0A" fill-opacity=".14"/>
    <path d="M257 43v12l8 5" fill="none" stroke="#FF9F0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(620 170)">
    <rect x="0" y="0" width="242" height="48" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#0A84FF" stroke-opacity=".7"/>
    <circle cx="26" cy="24" r="10" fill="#0A84FF"/>
    <text x="48" y="31" fill="#F0F6FC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="750">87%</text>
    <path d="M193 15a12 12 0 1 0 13 17 13 13 0 1 1-13-17Z" fill="#30D158"/>
    <text x="218" y="20" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="800">Z</text>
    <text x="228" y="12" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800">Z</text>
    <rect x="21" y="66" width="200" height="43" rx="12" fill="none" stroke="#484F58" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="m92 87 11 11 24-25" fill="none" stroke="#30D158" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="138" y="94" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" text-anchor="middle">PANEL RELEASED</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="750">
    <rect x="70" y="294" width="112" height="34" rx="17" fill="#FF9F0A" fill-opacity=".12"/>
    <text x="126" y="316" fill="#FFB340" text-anchor="middle">CPU ACTIVE</text>
    <rect x="191" y="294" width="126" height="34" rx="17" fill="#FF9F0A" fill-opacity=".12"/>
    <text x="254" y="316" fill="#FFB340" text-anchor="middle">UI LOADED</text>
    <rect x="326" y="294" width="122" height="34" rx="17" fill="#FF9F0A" fill-opacity=".12"/>
    <text x="387" y="316" fill="#FFB340" text-anchor="middle">MORE DRAIN</text>

    <rect x="552" y="294" width="112" height="34" rx="17" fill="#30D158" fill-opacity=".12"/>
    <text x="608" y="316" fill="#3DDC69" text-anchor="middle">CPU 0.0%*</text>
    <rect x="673" y="294" width="126" height="34" rx="17" fill="#30D158" fill-opacity=".12"/>
    <text x="736" y="316" fill="#3DDC69" text-anchor="middle">RAM FREED</text>
    <rect x="808" y="294" width="122" height="34" rx="17" fill="#30D158" fill-opacity=".12"/>
    <text x="869" y="316" fill="#3DDC69" text-anchor="middle">LESS DRAIN</text>
  </g>

  <text x="259" y="349" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" text-anchor="middle">Dashboard always alive</text>
  <text x="741" y="349" fill="#58A6FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="650" text-anchor="middle">Panel exists only when clicked</text>

  <text x="500" y="399" fill="#8B949E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">* v0.1.6 release test · 10/10 one-second idle samples at 0.0% CPU</text>
</svg>
